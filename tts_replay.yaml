schemaVersion: "2.0"

benchmark:
  model: Qwen/Qwen3-TTS-Tokenizer-12Hz
  
  endpoint:
    url: http://localhost:8000/v1/tts
    type: raw
    streaming: false
    
  dataset:
    type: file
    path: ./input.jsonl
    format: tts_trace
    sampling: sequential
    
  phases:
    type: profiling
    concurrency: 1
    duration: 60s
