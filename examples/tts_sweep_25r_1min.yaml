# TTS Synthetic Test: 25 requests in 1 minute

random_seed: 42

models:
  - tts-test-model

endpoint:
  type: raw
  urls:
    - http://localhost:8000/v1/audio/speech
  streaming: false

tokenizer:
  name: gpt2

artifacts:
  dir: ./artifacts/tts_sweep/25r_1min

datasets:
  - name: tts_synthetic_25r
    type: file
    format: tts_synthetic
    records:
      - duration_sec: 60
        num_requests: 25
        input_length_min: 1
        input_length_max: 30
        audio_duration_min_ms: 500
        audio_duration_max_ms: 5000
        voice: aiden

phases:
  - name: profiling
    type: fixed_schedule
    auto_offset: true

runtime:
  ui: simple
